set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "screen-256color"
set-window-option -g xterm-keys on
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'screen*:extkeys'
set -as terminal-features 'tmux*:extkeys'
set -g allow-passthrough on
bind m set -g mouse \; display "Mouse: #{?mouse,on,off}"
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1
bind J command-prompt -p "join window:" "join-pane -h -s '%%'"
bind B break-pane
# prefix + M: move THIS window into another session (created on the fly if it
# doesn't exist yet, without a leftover placeholder window), so windows can be
# re-shuffled between project sessions with one keystroke. Empty prompt cancels.
bind M command-prompt -p "move window to session:" \
  "run-shell '~/.local/bin/tmux-move-window #{window_id} %%'"
# prefix + R: rename THIS project (tmux session). Pre-fills the current name (#S)
# so you can edit it (Enter keeps it). Per-session options like @order survive the
# rename, so the M-j chooser's grouping/ordering is unaffected. Empty name cancels.
bind R command-prompt -I "#S" -p "rename project:" "rename-session -- '%%'"
# gather first N windows into one tiled window / restore them exactly
bind g command-prompt -p "gather N windows:" "run-shell '~/.local/bin/tmux-merge merge %%'"
bind G run-shell "~/.local/bin/tmux-merge restore"
# Alt+j: fast window chooser (project-grouped list + live pane preview) via fzf.
# Ctrl+Alt+j: same chooser plus a third column with the SLURM job queue — that
# takes a one-shot squeue snapshot at open, so it lags a beat; M-j skips it.
# (Was Alt+Shift+j, but that gets swallowed by the terminal/OS before tmux.)
# Root-table bindings (-n) so no prefix is needed, matching the M-1..M-0 binds.
# The leading run-shell stashes the current window in @twf_here (run-shell
# expands #{} formats, which display-popup's command can't) so the chooser can
# open with its cursor already on the window we launched from.
bind -n M-j   run-shell "tmux set -g @twf_here '#{session_name}:#{window_index}'" \; display-popup -E -w 90% -h 80% "~/.local/bin/tmux-window-fzf"
bind -n C-M-j run-shell "tmux set -g @twf_here '#{session_name}:#{window_index}'" \; display-popup -E -w 90% -h 80% "~/.local/bin/tmux-window-fzf --jobs"

# Fallback state watcher for Claude windows not (yet) managed by the
# claude-tmux-state hooks — e.g. sessions started before the hooks existed.
# It only touches windows where @claude_hooked is unset, so it never clobbers
# precise hook-driven state. Deduped so config reloads don't stack instances.
if-shell '! pgrep -f "[c]laude-tmux-watch" >/dev/null 2>&1' \
  'run-shell -b "$HOME/.local/bin/claude-tmux-watch"'

# prefix + S: manually override this window's Claude state glyph. Holds until the
# next hook event rewrites it (or 'auto' clears it). Watcher skips @claude_manual.
bind S display-menu -T "#[align=centre]set claude state" -x C -y C \
  "running  (orange ●)"   r "run-shell '~/.local/bin/claude-tmux-set running'" \
  "waiting  (orange ○)"   w "run-shell '~/.local/bin/claude-tmux-set bg'" \
  "your turn (green ●)"   y "run-shell '~/.local/bin/claude-tmux-set you'" \
  "" \
  "auto (clear override)" a "run-shell '~/.local/bin/claude-tmux-set auto'"

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

bind -T copy-mode-vi WheelUpPane   send -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 1 scroll-down
bind -T copy-mode    WheelUpPane   send -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane send -X -N 1 scroll-down

unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode    MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection-no-clear

# ── Plugins (TPM) ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'niksingh710/minimal-tmux-status'

# minimal-tmux-status — defaults shown; tweak colors/position here
set -g @minimal-tmux-fg "#000000"
set -g @minimal-tmux-bg "#698DDA"
set -g @minimal-tmux-status "bottom"
set -g @minimal-tmux-indicator true

# Claude session state glyph appended to each window tab, driven by the per-window
# @claude_state set by the claude-tmux-state hook. Glyphs: orange ● running,
# orange ○ waiting (bg/ext, not your turn), green ● your turn.
# Placed AFTER the name so the colour never bleeds into the current-window style.
set -g @minimal-tmux-window-status-format ' #I:#{?#{m:ssh*,#{pane_current_command}},#(ps -t #{pane_tty} -o args= | grep "^ssh " | sed "s/.* //"),#W}#{?#{!=:#{@claude_state},}, #{?#{==:#{@claude_state},running},#[fg=colour208]●#[default],#{?#{==:#{@claude_state},bg},#[fg=colour208]○#[default],#{?#{==:#{@claude_state},ext},#[fg=colour208]○#[default],#{?#{==:#{@claude_state},you},#[fg=colour46]●#[default],}}}},} '

# toggle status bar: prefix + b
bind-key b set-option status

# Auto-install TPM on first run (new-cluster bootstrap)
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Keep this line last
run '~/.config/tmux/plugins/tpm/tpm'
